name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The interactive UI needs a real TTY and there is no test runner, so the
      # snapshot script (ink-testing-library) is the closest thing to a test: it
      # renders every screen with synthetic data and fails on a render error.
      - name: Render screen snapshots
        run: node --import tsx/esm scripts/snapshot.mjs
